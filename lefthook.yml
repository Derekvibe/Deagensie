# Lefthook configuration
# See https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    format:
      glob: '**/*.{js,ts,vue,json,md}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '**/*.{js,ts,vue,json,md}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    lint:
      glob: '**/*.{js,ts,vue,json,md}'
      run: pnpm lint
    typecheck:
      glob: '**/*.{ts,vue}'
      run: pnpm typecheck
